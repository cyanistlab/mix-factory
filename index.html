        ${c.choices && !c.done ? `<div class="ev-act">${c.choices.map(([l, v]) => `<button class="btn small ${v === 'skip' || v === 'let' || v === 'risk' ? 'ghost' : ''}" data-a="choose" data-i="${i}" data-v="${v}">${esc(l)}</button>`).join('')}</div>` : ''}
        ${c.result ? `<p class="ev-result">${esc(c.result)}</p>` : ''}</article>`).join('')}
      ${pending ? '' : '<div class="modal-act"><button class="btn go" data-a="close" data-autofocus>확인</button></div>'}`);
    return true;
  }

  function stageBars(res, P, transport) {
    const rows = ['weigh', 'mix', 'pack'].concat(res.ibc ? ['wash'] : []).map(k => {
      const list = P[k].filter(m => res.stat[m.id]), avg = key => list.length ? list.reduce((x, m) => x + res.stat[m.id][key], 0) / list.length / res.dayEnd : 0;
      return `<div class="mrow"><span class="mlab">${STAGE[k]} <small>${list.length}대</small></span><span class="mbar">${['run', 'change', 'hold', 'wait'].map(c => [c, avg(c)]).map(([c, v]) => v > 0.004 ? `<i class="u-${c}" style="width:${(v * 100).toFixed(1)}%"></i>` : '').join('')}</span><span class="mval">${pct(avg('run') + avg('change'))}</span></div>`;
    });
    const mv = transport ? res.moveBusy / (transport * res.dayEnd) : 0;
    rows.push(`<div class="mrow"><span class="mlab">운반 <small>${transport}명</small></span><span class="mbar"><i class="u-run" style="width:${(Math.min(1, mv) * 100).toFixed(1)}%"></i></span><span class="mval">${pct(mv)}</span></div>`);
    if (res.ibc) { const cw = res.ibc.short / res.dayEnd; rows.push(`<div class="mrow"><span class="mlab">컨테이너 <small>${res.ibc.count}개</small></span><span class="mbar"><i class="u-wait" style="width:${(Math.min(1, cw) * 100).toFixed(1)}%"></i></span><span class="mval">${pct(cw)}</span></div>`); }
    return `<div class="mrows">${rows.join('')}</div>`;
  }
  function trialModal(res, P) {
    const a = analysis();
    modal(`<p class="eyebrow">시운전 결과</p><h2>하루 ${ton(res.total)} 생산</h2>
      <p class="muted">영업 중인 품목을 보통 주문 크기로 8시간 돌렸습니다. 병목은 <b>${STAGE[a.bottleneck]}</b>입니다.</p>
      ${stageBars(res, P, S.transport)}<p class="small">${meterNote(a)}</p>
      <div class="modal-act"><button class="btn go" data-a="close" data-autofocus>배치 계속하기</button></div>`);
  }
  function reportModal(rep) {
    const pl = rep.pl;
    const rows = [['매출', pl.revenue], ['원료·포장재', -pl.cogs], ['지체상금·위약금', -pl.penalty], ['현장 인건비', -pl.wages], ['관리직', -pl.mgr], ['잔업 수당', -pl.ot], ['관리비', -pl.overhead], ['설비 정비', -pl.maint], ['품목 관리비', -pl.sku], ['세척 직접비(세제·용수·검사)', -pl.clean], ['재고 보관비', -(pl.hold || 0)], ['남은 재고 평가손', -(pl.writeDown || 0)], ['기타(사고·채용·원료가 등)', -pl.extra]]
      .filter(([, v]) => Math.abs(v) >= 1).map(([l, v]) => `<tr><td>${l}</td><td class="num ${v < 0 ? 'neg' : ''}">${won(v)}</td></tr>`).join('');
    const prod = Object.keys(rep.res.produced).map(k => `<li>${chip(PT.SKU[k].color)}<span>${PT.SKU[k].name}</span><b>${kgf(rep.res.produced[k])}</b></li>`).join('');
    const ship = rep.shipped.map(o => `<li>${chip(PT.SKU[o.sku].color)}<span>${esc(o.cust)} ${kgf(o.kg)}</span>${o.late ? `<span class="due warn">${o.late}일 지연</span>` : '<span class="okay">납기 내</span>'}</li>`).join('')
      + rep.canceled.map(o => `<li>${chip(PT.SKU[o.sku].color)}<span>${esc(o.cust)} ${kgf(o.kg)}</span><span class="due bad">취소</span></li>`).join('');
    const tips = [];
    if (rep.rush && !rep.rush.shipped) tips.push(`급발주 ${PT.SKU[rep.rush.sku].name} ${kgf(rep.rush.kg)}를 오늘 못 보냈습니다. 순서 뒤쪽에 두면 시간이 모자랍니다. 늦은 날마다 위약금이 붙고, 이틀 넘으면 취소됩니다.`);
    else if (rep.rush) tips.push(`급발주의 대가: ${PT.SKU[rep.rush.sku].name} ${kgf(rep.rush.kg)}를 끼워 넣느라 세척·전환이 ${rep.rush.change > 0 ? dur(rep.rush.change) + ' 늘고' : '늘지 않고'}, 다른 품목을 ${rep.rush.lost > 50 ? ton(rep.rush.lost) + ' 덜 만들었습니다' : '거의 덜 만들지 않았습니다'}.`);
    if (rep.fromStock) tips.push(`정기 발주 ${rep.fromStock}건을 그날 내보냈습니다. 목표 재고를 두면 그날 만들지 않아도 재고로 바로 보낼 수 있습니다.`);
    if (rep.hold && rep.hold.outside) tips.push(`제품 랙이 넘쳐 ${ton(rep.hold.outside)}을 바깥 창고에 뒀습니다. 목표 재고를 줄이거나 제품 랙을 더 두세요.`);
    if (rep.wetCount) tips.push(`습식 세척 ${rep.wetCount}번, ${dur(rep.wet)}. 알러겐이 빠지는 순서마다 생깁니다. 품목을 줄이거나 순서를 바꾸면 줄어듭니다.`);
    if (rep.res.ibc && rep.res.ibc.wet) tips.push(`IBC 컨테이너 습식 세척 ${rep.res.ibc.wet}번. 세척기에서 따로 씻어 블렌더·포장기는 멈추지 않았습니다(세척 직접비만 듦).`);
    if (rep.stageBusy[rep.bottleneck] > 0.85) tips.push({ weigh: '계량이 쉬지 못했습니다.', mix: '믹서가 쉬지 못했습니다. 믹서 앞의 세척 시간이 곧 생산량 손실입니다.', pack: '포장기가 쉬지 못했습니다. 앞 공정에 돈을 써도 생산량은 늘지 않습니다.', move: '운반 작업자가 쉬지 못했습니다. 다른 설비가 운반을 기다렸습니다.', wash: '컨테이너 세척기가 쉬지 못했습니다. 습식 세척이 많은 날은 깨끗한 컨테이너가 모자랍니다.', cont: '충전 스테이션이 빈 컨테이너를 기다리느라 자주 섰습니다.' }[rep.bottleneck]);
    if (rep.res.total < rep.demand * 0.8) tips.push('들어온 주문보다 적게 만들었습니다. 이대로면 납기가 밀립니다.');
    if (Math.max(rep.stageBusy.weigh, rep.stageBusy.mix, rep.stageBusy.pack) < 0.5 && rep.res.total >= rep.demand) tips.push('설비가 절반 넘게 놀았습니다. 수요보다 큰 설비는 고정비만 늘립니다.');
    modal(`<p class="eyebrow">${rep.day}일차 마감</p><h2 class="${pl.opProfit < 0 ? 'neg' : ''}">영업이익 ${won(pl.opProfit)}</h2>
      <p class="muted">생산 ${ton(rep.res.total)} · 들어온 주문 ${ton(rep.demand)} · 출고 ${rep.shipped.length}건 · 병목 ${STAGE[rep.bottleneck]}</p>
      ${ceoLine(rep.ceo)}
      ${rep.events.length ? `<ul class="events">${rep.events.map(e => `<li class="t-${e.tone}">${esc(e.text)}</li>`).join('')}</ul>` : ''}
      ${tips.length ? `<div class="tips"><h3>오늘 본 것</h3><ul>${tips.slice(0, 3).map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
      ${rep.newNotes && rep.newNotes.length ? `<div class="tips got-notes"><h3>개발자 노트 획득 (${notesGot().length}/${PT.NOTES.length})</h3><ul>${rep.newNotes.map(id => `<li>${esc(PT.NOTES.find(n => n.id === id).title)}</li>`).join('')}</ul><button class="btn small ghost" data-a="notes">노트 읽기</button></div>` : ''}
      <div class="report-grid">
        <section><h3>공정별 시간</h3>${stageBars(rep.res, rep.P, S.transport)}</section>
        <section><h3>손익</h3><table class="tbl pl"><tbody>${rows}<tr class="total"><td>영업이익</td><td class="num ${pl.opProfit < 0 ? 'neg' : ''}">${won(pl.opProfit)}</td></tr></tbody></table></section>
        <section><h3>생산</h3>${prod ? `<ul class="mini">${prod}</ul>` : '<p class="empty">없음</p>'}</section>
        <section><h3>출고</h3>${ship ? `<ul class="mini">${ship}</ul>` : '<p class="empty">없음</p>'}</section>
      </div>
      <div class="modal-act"><button class="btn go" data-a="next" data-autofocus>${S.over ? '최종 결과' : `${S.day}일차로`}</button></div>`, true);
  }

  function endModal() {
    const gr = G.grade(S), pb = G.payback(S), code = G.resultCode(S), sc = G.scen(S);
    addToBoard(code);
    addNote('payback');
    const final = gr.g === 'S' ? '자네 덕에 공장이 살았어. 다음 공장도 맡아주게.' : gr.g === 'A' ? '훌륭해. 숫자도 납기도 다 잡았군.' : gr.g === 'B' ? '안정적이야. 병목 하나만 더 잡았으면 좋았을 텐데.' : gr.g === 'C' ? '돌아가긴 했지. 투자한 만큼 벌었는지는 다시 보자고.' : '이번 건 수업료라고 생각하지. 다시 해보게.';
    const shot = cv().toDataURL();
    modal(`<div class="result">
      <div class="rc-head"><span class="g g-${gr.g}">${gr.g}</span><div><p class="eyebrow">${esc(sc.name)} · ${esc(S.nick || '익명')}</p><h2>${gr.label}</h2>
        <p>투자 회수 <b>${isFinite(pb) ? pb.toFixed(1) + '개월' : '불가'}</b> · 납기 준수 <b>${pct(G.otif(S))}</b></p>
        <p class="muted small">회수 등급 ${gr.pay}(10개월 S · 14 A · 20 B · 30 C) · 납기 등급 ${gr.service}(90% S · 85% A · 75% B · 60% C) 중 낮은 쪽</p></div></div>
      <div class="rc-body"><img class="rc-shot" src="${shot}" alt="내 공장">
        <table class="tbl pl"><tbody><tr><td>총 투자</td><td class="num">${won(S.invested)}</td></tr><tr><td>20일 누적 영업이익</td><td class="num">${won(S.profitCum)}</td></tr>
        <tr><td>최근 5일 평균 영업이익</td><td class="num">${won(G.recentProfit(S))}</td></tr><tr><td>총 생산</td><td class="num">${ton(S.totals.producedKg)}</td></tr>
        <tr><td>영업 품목</td><td class="num">${S.enabled.length}개</td></tr><tr><td>관리직</td><td class="num">${S.managers.length}명</td></tr></tbody></table></div>
      <div class="badges">${Object.keys(PT.BADGES).map(id => `<span class="bdg ${S.badges.includes(id) ? 'on' : ''}" title="${esc(PT.BADGES[id].desc)}">${esc(PT.BADGES[id].name)}</span>`).join('')}</div>
      ${ceoLine(final)}
      <div class="code"><label for="codeOut">결과 코드</label><input id="codeOut" readonly value="${code}"><button class="btn small" data-a="copy">복사</button></div>
      <p class="small muted">결과 코드를 팀 채팅에 올리면, 누구든 메뉴의 팀 순위표에 붙여넣어 순위를 볼 수 있습니다.</p>
      ${Object.keys(S.skuStats).length ? `<details><summary>품목별 진짜 이익 보기</summary>${skuTable(true)}</details>` : ''}
      <div class="modal-act"><button class="btn ghost" data-a="notes">개발자 노트</button><button class="btn ghost" data-a="board">팀 순위표</button><button class="btn ghost" data-a="title">처음 화면으로</button><button class="btn go" data-a="redo" data-autofocus>같은 시나리오 다시</button></div></div>`, true);
  }

  // ── 팀 순위표 (결과 코드를 모아 이 브라우저에 보관) ─────────
  function board() { return store.get(BOARD_KEY) || []; }
  function addToBoard(code) {
    const d = G.readCode(code);
    if (!d) return false;
    const list = board().filter(x => x.code !== code);
    list.push(Object.assign({ code }, d));
    store.set(BOARD_KEY, list);
    return true;
  }
  function boardModal(scFilter) {
    const list = board();
    const scs = PT.SCENARIOS.concat([PT.FREE]);
    const f = scFilter || (list.length ? list[list.length - 1].sc : 's1');
    const rank = { S: 0, A: 1, B: 2, C: 3, D: 4 };
    const rows = list.filter(x => x.sc === f).sort((a, b) => rank[a.g] - rank[b.g] || a.pb - b.pb || b.pr - a.pr)
      .map((x, i) => `<tr><td class="num">${i + 1}</td><td>${esc(x.nk)}</td><td><span class="gchip g-${x.g}">${x.g}</span></td><td class="num">${x.pb >= 999 ? '불가' : x.pb + '개월'}</td><td class="num">${x.ot}%</td><td class="num">${won(x.pr * 1e4)}</td><td class="num">${x.sk}</td><td><button class="icon-btn" data-a="unboard" data-code="${esc(x.code)}" title="지우기">×</button></td></tr>`).join('');
    modal(`<p class="eyebrow">팀 순위표</p><h2>누가 공장을 제일 잘 지었나</h2>
      <div class="seg">${scs.map(s => `<button class="${f === s.id ? 'on' : ''}" data-a="boardsc" data-v="${s.id}">${esc(s.name)}</button>`).join('')}</div>
      ${rows ? `<div class="scroll-x"><table class="tbl"><thead><tr><th class="num">#</th><th>이름</th><th>등급</th><th class="num">회수</th><th class="num">납기</th><th class="num">누적 이익</th><th class="num">품목</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">아직 이 시나리오 기록이 없습니다.</p>'}
      <div class="code"><label for="codeIn">결과 코드 붙여넣기</label><textarea id="codeIn" rows="2" placeholder="PT-... 여러 개를 줄바꿈으로 붙여넣어도 됩니다"></textarea><button class="btn small" data-a="addcode">추가</button></div>
      <p class="small muted">순위: 등급 → 회수 기간이 짧은 순 → 누적 이익 순. 이 순위표는 이 브라우저에만 저장됩니다.</p>
      <div class="modal-act"><button class="btn go" data-a="back" data-autofocus>닫기</button></div>`, true);
  }

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2400); }

  // ── 입력 ────────────────────────────────────────
  function act(a, el) {
    const m = ui.sel && G.byId(S, ui.sel);
    const tweak = () => { if (S.tut && S.tut.trial) S.tut.tweak = true; };
    switch (a) {
      case 'tab': ui.tab = el.dataset.tab; break;
      case 'outside': ui.outside = !!el.dataset.v; ui.scrollBottom = !ui.outside; break;
      case 'view': ui.view = el.dataset.v ? +el.dataset.v : null; ui.viewChosen = true; ui.ghost = null; ui.scrollBottom = !ui.view; break;
      case 'pick':
        ui.mode = { kind: 'place', type: el.dataset.type, rot: false }; ui.ghost = null; ui.tab = 'build';
        if (window.innerWidth < 1100) document.querySelector('.stage-card').scrollIntoView({ block: 'start', behavior: 'smooth' });   // 좁은 화면: 고르면 공장 화면으로
        break;
      case 'rotate': if (ui.mode) { ui.mode.rot = !ui.mode.rot; ui.ghost = null; } break;
      case 'cancel': ui.mode = null; ui.ghost = null; break;
      case 'quick': if (G.quickStart(S, el.dataset.kind)) { if (S.tut) S.tut = null; ui.scrollBottom = true; changed(); toast(el.dataset.kind === 'tower' ? '4층 타워를 깔았습니다. 스크롤해서 층마다 보세요.' : '추천 배치를 깔았습니다. 시운전을 눌러보세요.'); } else toast('빈 공장에서만 쓸 수 있습니다'); break;
      case 'transport': G.setTransport(S, S.transport + +el.dataset.d); tweak(); changed(); break;
      case 'ibc': if (!G.setIbc(S, S.ibcCount + +el.dataset.d)) toast('자본이 부족합니다'); changed(); break;
      case 'addon': if (G.addOn(S, el.dataset.kind)) { ui.scrollBottom = false; changed(); toast(el.dataset.kind === 'ibc' ? 'IBC 병렬 라인을 2층에 놓았습니다. 시운전으로 비교해보세요.' : '2층에 순차 라인을 하나 더 놓았습니다. 시운전으로 비교해보세요.'); } else toast('2층이 비어 있어야 합니다. 먼저 증설을 되돌리세요.'); break;
      case 'undoAddon': G.undoAddOn(S); changed(); toast('증설한 설비를 모두 되돌렸습니다.'); break;
      case 'feeds': G.setFeeds(S, ui.sel, el.dataset.id); changed(); break;
      case 'crew': if (m) { G.setCrew(S, m.id, m.crew + +el.dataset.d); tweak(); changed(); } break;
      case 'link': if (!G.setLink(S, el.dataset.from, el.dataset.to, el.dataset.kind)) toast('설치할 수 없습니다'); else { tweak(); changed(); } break;
      case 'move':
        if (m) { ui.mode = { kind: 'move', id: m.id, type: m.type, rot: m.rot }; ui.ghost = null; if (window.innerWidth < 1100) document.querySelector('.stage-card').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
        break;
      case 'sell':
        if (!m) break;
        if (ui.confirm !== 'sell:' + m.id) { ui.confirm = 'sell:' + m.id; break; }
        if (G.sell(S, m.id) < 0) { toast('관리직이 앉아 있는 사무실은 팔 수 없습니다'); break; }
        ui.sel = null; ui.confirm = null; changed(); break;
      case 'sku': G.toggleSku(S, el.dataset.id); if (S.phase === 'run') S.plan = G.makePlan(S); changed(); break;
      case 'rule': if (G.ruleOpen(S, el.dataset.v)) { S.planRule = el.dataset.v; S.plan = G.makePlan(S); changed(); } break;
      case 'stk': { const box = el.dataset.k === 'mts' ? S.mts : S.extra; G.setStockPlan(S, el.dataset.k, el.dataset.id, (box[el.dataset.id] || 0) + +el.dataset.d); changed(); break; }
      case 'push': if (G.requestSales(S, el.dataset.id)) { changed(); toast(`영업팀: "${PT.SKU[el.dataset.id].name}, 내일부터 더 팔아 볼게요. 대신 약속한 날엔 꼭 보내 주세요."`); } break;
      case 'hint': { const h = G.hint(S); if (h) { ui.hint = Object.assign({ day: S.day }, h); save(); } break; }
      case 'hintApply': if (ui.hint && ui.hint.kind === 'move' && G.movePlan(S, ui.hint.i, ui.hint.j)) { ui.hint = null; gotNote('sequence'); changed(); } break;
      case 'ot': S.overtime = +el.dataset.v; changed(); break;
      case 'up': case 'down': { const i = +el.dataset.i; if (G.movePlan(S, i, a === 'up' ? i - 1 : i + 1)) { ui.hint = null; gotNote('sequence'); changed(); } break; }
      case 'hire': if (!G.hire(S, el.dataset.id)) toast('자리가 없거나 돈이 부족합니다'); else changed(); break;
      case 'raise': G.raise(S, el.dataset.id); changed(); toast('연봉을 올렸습니다. 만족도가 올랐습니다.'); break;
      case 'fire':
        if (ui.confirm !== 'fire:' + el.dataset.id) { ui.confirm = 'fire:' + el.dataset.id; break; }
        G.fire(S, el.dataset.id); ui.confirm = null; changed(); break;
      case 'refresh': if (G.refreshCandidates(S, false)) changed(); break;
      case 'trial': {
        const P = PT.compile(S);
        const res = PT.simulate(P, PT.testPlan(S), { dayMin: PT.SHIFT_MIN, start: {}, record: true });
        if (S.tut) S.tut.trial = true;
        save();
        play(res, P, '시운전 · 보통 주문으로 하루', () => trialModal(res, P));
        return;
      }
      case 'open':
        if (G.open(S)) { ui.tab = 'sales'; changed(); render(); if (!morningModal()) toast('개업했습니다. 첫 주문이 들어왔습니다.'); return; }
        break;
      case 'run': {
        const before = { day: S.day, cash: S.cash, hist: S.history.length, recent: G.recentProfit(S), pb: G.payback(S), otif: G.otif(S) };
        const rep = G.runDay(S);
        if (!rep) { toast('라인을 돌릴 수 없습니다'); return; }
        rep.res.events = rep.events;
        save();
        ui.hint = null;
        play(rep.res, rep.P, `${rep.day}일차 가동 중`, () => { rep.newNotes = reportNotes(rep); ui.lastReport = rep; changed(); render(); reportModal(rep); }, before);
        return;
      }
      case 'speed': ui.speed = +el.dataset.v; renderRunbar(); return;
      case 'skip': if (ui.anim) finish(); return;
      case 'morning': morningModal(); return;
      case 'choose': G.resolve(S, +el.dataset.i, el.dataset.v); changed(); morningModal(); render(); return;
      case 'close': closeModal(); break;
      case 'next': closeModal(); if (S.over) { endModal(); return; } render(); morningModal(); return;
      case 'end': endModal(); return;
      case 'new': {
        const nick = (($('#nickIn') || {}).value || '').trim();
        store.set(NICK_KEY, nick);
        const opts = el.dataset.scen === 'free' ? { seed: parseInt(($('#seedIn') || {}).value, 10) || 2611, capital: Math.round((parseFloat(($('#capIn') || {}).value) || 12) * 1e8) } : {};
        enterGame(G.newGame(el.dataset.scen, nick, opts));
        return;
      }
      case 'continue': enterGame(load()); return;
      case 'redo': { const sc = S.scen, o = { seed: S.seed, capital: S.capital }; S = G.newGame(sc, S.nick, o); ui.sel = null; ui.tab = 'build'; ui.view = null; ui.viewChosen = false; ui.scrollBottom = true; closeModal(); changed(); break; }
      case 'menu': pauseMenu(); return;
      case 'back': ui.confirm = null; back(); return;
      case 'title': titleScreen('menu'); return;
      case 'tStart': startModal(); return;
      case 'tLoad': slotsModal('load'); return;
      case 'tSave': slotsModal('save'); return;
      case 'loadSlot': { const v = slotState(+el.dataset.n); if (v) enterGame(v); return; }
      case 'saveSlot': {
        const n = +el.dataset.n;
        if (slotState(n) && ui.confirm !== 'save:' + n) { ui.confirm = 'save:' + n; slotsModal('save'); return; }
        ui.confirm = null;
        store.set(slotKey(n), { at: Date.now(), state: S });
        toast(`저장 칸 ${n}에 저장했습니다`);
        slotsModal('save');
        return;
      }
      case 'help': helpModal(); return;
      case 'notes': ui.backTo = $('#modalCard [data-a="next"]') && ui.lastReport ? (r => () => reportModal(r))(ui.lastReport) : null; notesModal(); return;
      case 'copyNote': {
        const url = location.href.split('#')[0] + '#note';
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('링크를 복사했습니다. 게임을 안 하는 사람도 이 링크로 노트를 바로 볼 수 있습니다.'), () => toast(url)); else toast(url);
        return;
      }
      case 'board': boardModal(); return;
      case 'boardsc': boardModal(el.dataset.v); return;
      case 'addcode': {
        const lines = ($('#codeIn').value || '').split(/\s+/).filter(Boolean);
        const ok = lines.filter(addToBoard).length;
        toast(ok ? `${ok}건 추가했습니다` : '올바른 결과 코드가 아닙니다');
        boardModal(); return;
      }
      case 'unboard': store.set(BOARD_KEY, board().filter(x => x.code !== el.dataset.code)); boardModal(); return;
      case 'copy': {
        const inp = $('#codeOut');
        const fallback = () => { inp.select(); toast('코드를 선택했습니다. Ctrl+C로 복사하세요.'); };
        if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(() => toast('복사했습니다'), fallback); else fallback();
        return;
      }
      default: return;
    }
    render();
  }

  document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; act(el.dataset.a, el); });
  // 타이틀: 아무 키나(또는 화면을 누르면) 메뉴로, 메뉴는 화살표·숫자로도 고른다
  $('#title').addEventListener('click', () => { if (ui.title === 'press') showTitleMenu(); });
  function titleKey(e) {
    if (ui.title === 'press') { if (!['Shift', 'Control', 'Alt', 'Meta', 'Tab'].includes(e.key)) { e.preventDefault(); showTitleMenu(); } return; }
    const n = TITLE_MENU.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ui.titleSel = (ui.titleSel + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; focusTitle(); }
    else if (/^[1-9]$/.test(e.key) && +e.key <= n) { e.preventDefault(); act(TITLE_MENU[+e.key - 1][0], { dataset: {} }); }
  }
  document.addEventListener('keydown', e => {
    if (ui.title && $('#modal').hidden) { titleKey(e); return; }
    if (!S || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if ((e.key === 'r' || e.key === 'R') && ui.mode) { ui.mode.rot = !ui.mode.rot; ui.ghost = null; render(); }
    if (e.key === 'Escape') { if (ui.mode) { ui.mode = null; ui.ghost = null; render(); } else if (!$('#modal').hidden && $('#modalCard').querySelector('[data-a="close"]')) closeModal(); else if (!$('#modal').hidden && $('#modalCard').querySelector('[data-a="back"]')) back(); else if (ui.sel) { ui.sel = null; render(); } }
    if (e.key === ' ' && ui.anim) { e.preventDefault(); ui.speed = ui.speed ? 0 : 1; renderRunbar(); }
  });
  window.addEventListener('resize', () => { if (S) draw(); });
  // 대기 화면: 컨베이어·튜토리얼 표시가 살아 움직이도록 가볍게 다시 그린다
  setInterval(() => {
    if (!S || ui.anim || document.visibilityState !== 'visible') return;
    if (Object.values(S.links).some(l => l.kind === 'conveyor') || (S.tut && S.tut.step < 5)) V.draw(cv(), S, drawOpts());
  }, 250);

  ui.state = () => S;
  ui.refresh = () => { changed(); render(); };

  function boot(data) {
    bindCanvas();
    document.title = PT.TITLE.name;
    $('.brand-mark').textContent = PT.TITLE.mark;
    $('.brand-name').textContent = PT.TITLE.name;
    ui.scrollBottom = true;
    if (data && data.state && data.state.v === 3) { S = G.migrate(data.state); render(); return; }
    S = load() || G.newGame('s1', store.get(NICK_KEY) || '');
    render();
    // 주소 끝이 #note면 게임을 안 하는 사람도 개발자 노트부터 바로 본다
    if (location.hash === '#note') { titleScreen('menu'); notesModal(); return; }
    titleScreen('press');
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ state: S }));
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
